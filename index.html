<!DOCTYPE html>
<html>
<body style="background:#222; color:white; font-size:30px; text-align:center;">

<p id="score">Score: 0</p>

<canvas id="game" width="300" height="300" style="background:#444;"></canvas>

<script>
let score = 0;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

draw();

// PC用クリック
canvas.addEventListener("click", () => {
  score++;
  draw();
});

// スマホ用タップ（iPhone対応）
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault(); // ズーム誤判定を防ぐ
  score++;
  draw();
}, { passive: false });

function draw() {
  ctx.fillStyle = "#444";
  ctx.fillRect(0, 0, 300, 300);

  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(150, 150, 40, 0, Math.PI * 2);
  ctx.fill();

  document.getElementById("score").innerText = "Score: " + score;
}
</script>

</body>
</html>
