<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vibe Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <main class="wrap">
    <header class="hero">
      <h1 class="title">Vibe Game</h1>
      <p class="subtitle">クリック／タップでバイブを感じろ</p>
    </header>

    <section class="game-area" aria-label="ゲーム領域">
      <p id="score" class="score" aria-live="polite">Score: 0</p>
      <canvas id="game" width="300" height="300" aria-label="ゲームキャンバス"></canvas>
    </section>

    <footer class="foot">
      <p>Made with neon vibes ✨</p>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
